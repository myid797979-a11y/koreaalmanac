# 매일 새벽 05:47 KST — 수집(증분) → 익스포트 → 빌드 → Cloudflare Pages 배포
# DB는 잡 안의 임시 컨테이너. 수집분은 db/dump로 repo에 보존해 증분만 API로 받는다
# (전량 재수집은 개발계정 쿼터 1,000콜/일/언어를 초과하므로 금지).
name: daily-update

on:
  schedule:
    # 18:47 UTC = 03:47 KST. GitHub 예약 실행은 2~3시간씩 밀려서(10/5 08:36 시작, 10/6 08시 넘어도 미실행)
    # 05:47 로 두면 한국 아침에 어제 날짜가 남았다. 두 시간 당겨 지연돼도 아침 전에 끝나게 한다. 청약각(05:23)과도 겹치지 않는다.
    - cron: '47 18 * * *'
  workflow_dispatch:

permissions:
  contents: write            # 덤프·데이터 변경분 커밋용

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tour
          POSTGRES_USER: tour
          POSTGRES_PASSWORD: tour_dev
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U tour"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TOUR_DB: Host=localhost;Port=5435;Database=tour;Username=tour;Password=tour_dev
      TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 스키마 적용 + 어제까지 수집분 복원
        run: |
          dotnet run --project Tour.Collector -- init
          dotnet run --project Tour.Collector -- restore

      # KTO GW 가 장시간 응답 불능인 날에도 복원분(어제 데이터)으로 빌드·배포는 계속한다.
      #
      # 명령마다 실패를 따로 흡수한다. 예전엔 bash -e 라 첫 명령(festivals)이 죽으면
      # 뒤의 details·images·stats 가 통째로 안 돌았다 — 목록 갱신 한 번 실패에
      # 그날 상세 수집까지 같이 날아갔다. 상세·이미지는 복원된 데이터로도 진행할 수 있다.
      - name: 축제 수집 (목록 갱신 + 신규 상세 + 이미지 드레인)
        continue-on-error: true
        run: |
          for cmd in "festivals" "details eng" "details kor" "images eng" "images kor" "stats"; do
            echo "── $cmd"
            dotnet run --project Tour.Collector -- $cmd || echo "⚠ [$cmd] 실패 — 건너뛰고 계속"
          done

      # 문화정보(국악·전통공연·전시) — 별도 API·별도 쿼터(일 10,000콜), 실패해도 배포는 계속
      - name: 문화정보 수집
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: dotnet run --project Tour.Collector -- culture

      # 관광지 소개문·개관시간 — 축제와 같은 eng 쿼터(950콜/일)를 쓰므로 축제 뒤에 둔다.
      # Collector 가 남은 예산만큼만 받고 멈추므로 축제 수집을 굶기지 않는다.
      #
      # 예전엔 이 단계가 워크플로에 없어 사람이 기억할 때만 돌았다. 그 결과
      # 개관시간·휴관일·입장료가 3,681곳 전부 비어 있었다 — 여행자가 관광지 페이지에서
      # 가장 먼저 묻는 "지금 열었나, 얼마인가" 에 답하지 못하는 상태였다.
      - name: 관광지 수집 (소개문 + 개관시간 드레인)
        continue-on-error: true
        run: dotnet run --project Tour.Collector -- places || echo "⚠ places 실패 — 건너뛰고 계속"

      # 공연예술통합전산망(KOPIS) — 또 다른 기관(예술경영지원센터)이라 쿼터가 완전히 별개다.
      # 정상 운영 시 하루 약 24콜만 쓴다(목록 6 + 신규 상세 ~16 + 신규 공연장 1~2).
      #
      # ⚠ 이 데이터는 사이트에 바로 나가지 않는다. 규칙으로는 "외국인이 갈 만한 공연"을
      #   가려낼 수 없기 때문이다 — 좌석수로 거르면 윤종신·부활이 올라오고, 로마자 제목으로
      #   거르면 `현대카드 슈퍼콘서트 28, 위켄드 (The Weeknd)` 가 떨어진다.
      #   수집만 자동으로 하고, 노출은 scripts/kopis-review.mjs 로 사람이 골라
      #   web/data/concerts.json 에 영어로 써 넣는다.
      - name: 공연 수집 (KOPIS)
        continue-on-error: true
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
        run: dotnet run --project Tour.Collector -- kopis || echo "⚠ kopis 실패 — 건너뛰고 계속"

      - name: 익스포트 + 덤프 갱신
        run: |
          dotnet run --project Tour.Exporter
          dotnet run --project Tour.Collector -- dump

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 웹 빌드
        working-directory: web
        run: |
          npm ci
          npm run build

      # 배포 전에 돌려야 한다 — sitemap.xml 에 <lastmod> 를 주입하고(Bing 지침 §3)
      # 바뀐 URL 목록을 남긴다. 그 목록을 배포 뒤 IndexNow 가 그대로 제출한다(§4).
      - name: 신선도 신호 (lastmod + 변경분 산출)
        working-directory: web
        run: node scripts/freshness.mjs

      - name: Cloudflare Pages 배포
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create koreaalmanac --production-branch=main || true
          npx wrangler pages deploy out --project-name=koreaalmanac --commit-dirty=true

      # 변경된 URL만 IndexNow로 통지 (Bing·Naver 등) — 실패해도 배포는 유지.
      # 전량 제출은 규약 위반에 가깝고 Bing이 신호를 무시한다.
      - name: IndexNow 핑
        working-directory: web
        run: node scripts/indexnow.mjs || true

      - name: 데이터 변경분 커밋 (덤프·번역큐·익스포트)
        run: |
          git config user.name "daily-update"
          git config user.email "actions@users.noreply.github.com"
          git add db/dump db/culture.json db/places.json data/translation_queue.json data/culture_queue.json web/data data/indexnow-state.json db/kopis.json db/kopis_venues.json
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push

      # 라이브 점검 — 실제 사이트 HTML 에 GA·AdSense·Klook(aid)·Agoda(cid) 가 있는지. 빠지면 이 실행을 실패로.
      # 맨 마지막에 둔다: 실패해도 데이터 커밋은 이미 끝나 있다. (청약각 GA 누락 사고, 2026-10)
      - name: 라이브 점검 (GA·제휴 태그)
        working-directory: web
        run: node scripts/live-check.mjs
